name: Daily job alert

# Runs once a day and emails you any new Strong/Good matches. See GITHUB_ACTIONS_SETUP.md for
# the one-time secrets setup this needs (resume, API keys, Gmail app password).
#
# Cron below is 01:30 UTC = 07:00 IST - edit the schedule line to change the time. You can
# always trigger a run manually from the repo's Actions tab too (workflow_dispatch below).
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch: {}

jobs:
  daily-search:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    # Edit this if your resume is a .docx instead of a .pdf - extract_resume_text() picks its
    # parser from the file extension, so this has to match the filename you push to the private
    # resume repo below.
    env:
      RESUME_EXT: pdf

    steps:
      - uses: actions/checkout@v4

      # Pulls your resume from a SEPARATE private repo instead of storing it as a chunked/base64
      # secret. Avoids the 48 KB-per-secret limit entirely (a previous version of this workflow
      # hit that with a truncated resume - see git history), and updating the resume going
      # forward is just "push a new file to that repo" instead of re-running a chunking script.
      # PRIVATE_RESUME_PAT is a fine-grained Personal Access Token scoped to read-only access to
      # ONLY that one private repo - see GITHUB_ACTIONS_SETUP.md for how to create it. Checked
      # out under app/private-data so the relative RESUME_PATH below (used with
      # working-directory: app) resolves correctly.
      - name: Checkout private resume repo
        uses: actions/checkout@v4
        with:
          repository: shaad459/resume-private
          token: ${{ secrets.PRIVATE_RESUME_PAT }}
          path: app/private-data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # actions/cache has no "update in place" - each run saves under a brand-new key
      # (github.run_id) and restores from whatever the most recent previous key was, via the
      # restore-keys prefix match below. Old entries are simply never restored again and
      # GitHub auto-evicts anything unused for 7 days, so this is self-cleaning - no separate
      # cleanup step needed.
      - name: Restore job database from cache
        uses: actions/cache/restore@v4
        with:
          path: app/jobfinder.db
          key: jobfinder-db-${{ github.run_id }}
          restore-keys: |
            jobfinder-db-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run search and send digest
        run: python run_scheduled_search.py
        env:
          RESUME_PATH: private-data/resume.${{ env.RESUME_EXT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}

      # Runs even if the search/email step above failed, so a bad run doesn't wipe out
      # yesterday's database - you keep whatever state existed before this run started.
      - name: Save job database to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: app/jobfinder.db
          key: jobfinder-db-${{ github.run_id }}
